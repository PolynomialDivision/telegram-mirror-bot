[package]
name = "telegram-mirror-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "telegram-mirror-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
grammers-client = "0.9"
grammers-session = "0.9"
grammers-tl-types = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime = "0.3"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
