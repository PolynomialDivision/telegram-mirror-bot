[package]
name = "telegram-mirror-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "telegram-mirror-bot"
path = "src/main.rs"

[dependencies]
matrix-sdk = { version = "0.17", features = ["sqlite"] }
matrix-sdk-base = "0.17"
grammers-client = "0.9"
grammers-session = "0.9"
grammers-tl-types = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
mime = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures-util = "0.3"
