[package]
name = "telegram-mirror-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "telegram-mirror-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3"
grammers-client = "0.10"
grammers-session = "0.10"
grammers-tl-types = "0.10"
# grammers-crypto 0.10 asks for ^2.0.0-rc0 but does not build with rc1.
# Drop this pin once a grammers release builds with a newer glass_pumpkin.
glass_pumpkin = "=2.0.0-rc0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime = "0.3"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
